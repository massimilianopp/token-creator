<svg width="960" height="720" viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg">

<defs>

<style>

.title{
font:700 30px Arial,sans-serif;
fill:white;
}

.subtitle{
font:15px Arial,sans-serif;
fill:#A1A1AA;
}

.boxTitle{
font:700 20px Arial,sans-serif;
fill:#111827;
}

.text{
font:15px Arial,sans-serif;
fill:#374151;
}

.caption{
font:14px Arial,sans-serif;
fill:#9CA3AF;
}

.box{
fill:white;
stroke:#E5E7EB;
stroke-width:2;
rx:16;
}

.arrow{
stroke:#7C3AED;
stroke-width:4;
fill:none;
marker-end:url(#arrowhead);
}

.badge{
fill:#F5F3FF;
stroke:#DDD6FE;
rx:8;
}

.badgeText{
font:13px Arial,sans-serif;
fill:#6D28D9;
font-weight:bold;
}

</style>

<marker
id="arrowhead"
markerWidth="12"
markerHeight="12"
refX="10"
refY="6"
orient="auto">

<polygon
points="0 0 12 6 0 12"
fill="#7C3AED"/>

</marker>

</defs>

<rect width="960" height="720" fill="#0B0B0F"/>

<text x="480" y="48" text-anchor="middle" class="title">
How a Vesting Contract Works
</text>

<text x="480" y="76" text-anchor="middle" class="subtitle">
Tokens remain locked until the vesting schedule gradually releases them.
</text>

<!-- Wallet -->

<rect class="box" x="80" y="140" width="240" height="130"/>

<text x="200" y="180" text-anchor="middle" class="boxTitle">
Project Wallet
</text>

<text x="200" y="220" text-anchor="middle" class="text">
1,000,000 TOKEN
</text>

<!-- Streamflow -->

<rect class="box" x="360" y="120" width="260" height="170"/>

<text x="490" y="160" text-anchor="middle" class="boxTitle">
Streamflow
</text>

<rect class="badge" x="420" y="178" width="140" height="24"/>
<text x="490" y="195" text-anchor="middle" class="badgeText">
Vesting Contract
</text>

<text x="390" y="230" class="text">🔒 Tokens locked</text>
<text x="390" y="255" class="text">📅 Unlock schedule</text>

<!-- Recipient -->

<rect class="box" x="670" y="140" width="210" height="130"/>

<text x="775" y="180" text-anchor="middle" class="boxTitle">
Recipient
</text>

<text x="775" y="220" text-anchor="middle" class="text">
Receives tokens
</text>

<!-- Arrows -->

<line class="arrow" x1="320" y1="205" x2="360" y2="205"/>

<line class="arrow" x1="620" y1="205" x2="670" y2="205"/>

<!-- Timeline -->

<rect class="box" x="120" y="400" width="720" height="170"/>

<text x="480" y="440" text-anchor="middle" class="boxTitle">
Unlock Timeline
</text>

<line x1="180" y1="510" x2="760" y2="510" stroke="#7C3AED" stroke-width="4"/>

<line x1="240" y1="495" x2="240" y2="525" stroke="#7C3AED" stroke-width="4"/>

<line x1="400" y1="495" x2="400" y2="525" stroke="#7C3AED" stroke-width="4"/>

<line x1="520" y1="495" x2="520" y2="525" stroke="#7C3AED" stroke-width="4"/>

<line x1="640" y1="495" x2="640" y2="525" stroke="#7C3AED" stroke-width="4"/>

<line x1="760" y1="495" x2="760" y2="525" stroke="#7C3AED" stroke-width="4"/>

<text x="240" y="480" text-anchor="middle" class="text">
Start
</text>

<text x="400" y="480" text-anchor="middle" class="text">
Cliff Ends
</text>

<text x="520" y="545" text-anchor="middle" class="text">
25%
</text>

<text x="640" y="545" text-anchor="middle" class="text">
50%
</text>

<text x="760" y="545" text-anchor="middle" class="text">
100%
</text>

<text x="480" y="630" text-anchor="middle" class="caption">
Recipients cannot claim tokens before the cliff. After that, tokens are released according to the vesting schedule.
</text>

</svg>