<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">

<defs>

<style>

.title{
font:700 30px Arial,sans-serif;
fill:#ffffff;
}

.subtitle{
font:15px Arial,sans-serif;
fill:#A1A1AA;
}

.label{
font:700 18px Arial,sans-serif;
fill:#111827;
}

.text{
font:14px Arial,sans-serif;
fill:#6B7280;
}

.small{
font:13px Arial,sans-serif;
fill:#6B7280;
}

.box{
fill:#ffffff;
stroke:#E5E7EB;
stroke-width:2;
rx:14;
}

.arrow{
stroke:#7C3AED;
stroke-width:4;
fill:none;
marker-end:url(#arrow);
}

</style>

<marker id="arrow"
markerWidth="10"
markerHeight="10"
refX="8"
refY="5"
orient="auto">

<polygon
points="0,0 10,5 0,10"
