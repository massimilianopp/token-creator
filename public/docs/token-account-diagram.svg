<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <style>
      .title{
        font:700 30px Arial,sans-serif;
        fill:#ffffff;
      }

      .subtitle{
        font:15px Arial,sans-serif;
        fill:#A1A1AA;
      }

      .label{
        font:700 18px Arial,sans-serif;
        fill:#111827;
      }

      .text{
        font:14px Arial,sans-serif;
        fill:#6B7280;
      }

      .balance{
        font:700 18px Arial,sans-serif;
        fill:#7C3AED;
      }

      .box{
        fill:#ffffff;
        stroke:#E5E7EB;
        stroke-width:2;
        rx:14;
      }

      .mint{
        fill:#F5F3FF;
        stroke:#7C3AED;
        stroke-width:2.5;
        rx:14;
      }

      .arrow{
        stroke:#7C3AED;
        stroke-width:4;
        fill:none;
        marker-end:url(#arrowhead);
      }

    </style>

    <marker
      id="arrowhead"
      markerWidth="12"
      markerHeight="12"
      refX="10"
      refY="6"
      orient="auto">

      <polygon
        points="0 0,12 6,0 12"
        fill="#7C3AED"/>

    </marker>

  </defs>

  <!-- Background -->

  <rect
    width="900"
    height="560"
    fill="#0B0B0F"/>

  <!-- Title -->

  <text
    x="450"
    y="48"
    text-anchor="middle"
    class="title">
    One Mint Account, Many Token Accounts
  </text>

  <text
    x="450"
    y="78"
    text-anchor="middle"
    class="subtitle">
    The Mint Account defines the token. Every wallet owns its own Token Account.
  </text>

  <!-- Mint -->

  <rect
    class="mint"
    x="305"
    y="110"
    width="290"
    height="95"/>

  <text
    x="450"
    y="145"
    text-anchor="middle"
    class="label">
    🪙 Mint Account
  </text>

  <text
    x="450"
    y="170"
    text-anchor="middle"
    class="text">
    SPL Token (ANA)
  </text>

  <text
    x="450"
    y="190"
    text-anchor="middle"
    class="text">
    Total supply • Decimals • Authorities
  </text>

  <!-- Arrows -->

  <line class="arrow" x1="450" y1="205" x2="180" y2="285"/>
  <line class="arrow" x1="450" y1="205" x2="450" y2="285"/>
  <line class="arrow" x1="450" y1="205" x2="720" y2="285"/>

  <!-- Wallet A -->

  <rect
    class="box"
    x="60"
    y="300"
    width="240"
    height="150"/>

  <text
    class="label"
    x="180"
    y="335"
    text-anchor="middle">
    👛 Wallet A
  </text>

  <text
    class="text"
    x="180"
    y="365"
    text-anchor="middle">
    Token Account
  </text>

  <text
    class="balance"
    x="180"
    y="410"
    text-anchor="middle">
    250 ANA
  </text>

  <!-- Wallet B -->

  <rect
    class="box"
    x="330"
    y="300"
    width="240"
    height="150"/>

  <text
    class="label"
    x="450"
    y="335"
    text-anchor="middle">
    👛 Wallet B
  </text>

  <text
    class="text"
    x="450"
    y="365"
    text-anchor="middle">
    Token Account
  </text>

  <text
    class="balance"
    x="450"
    y="410"
    text-anchor="middle">
    40 ANA
  </text>

  <!-- Wallet C -->

  <rect
    class="box"
    x="600"
    y="300"
    width="240"
    height="150"/>

  <text
    class="label"
    x="720"
    y="335"
    text-anchor="middle">
    👛 Wallet C
  </text>

  <text
    class="text"
    x="720"
    y="365"
    text-anchor="middle">
    Token Account
  </text>

  <text
    class="balance"
    x="720"
    y="410"
    text-anchor="middle">
    900 ANA
  </text>

  <!-- Footer -->

  <text
    x="450"
    y="515"
    text-anchor="middle"
    class="subtitle">
    Every wallet has its own Token Account, but they all reference the same Mint Account.
  </text>

</svg>