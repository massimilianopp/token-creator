<svg width="960" height="650" viewBox="0 0 960 650" xmlns="http://www.w3.org/2000/svg">

<defs>

<style>

.title{
font:700 30px Arial,sans-serif;
fill:white;
}

.subtitle{
font:15px Arial,sans-serif;
fill:#A1A1AA;
}

.boxTitle{
font:700 20px Arial,sans-serif;
fill:#111827;
}

.text{
font:15px Arial,sans-serif;
fill:#374151;
}

.caption{
font:14px Arial,sans-serif;
fill:#9CA3AF;
}

.label{
font:700 18px Arial,sans-serif;
fill:white;
}

.box{
fill:white;
stroke:#E5E7EB;
stroke-width:2;
rx:16;
}

.arrow{
stroke:#7C3AED;
stroke-width:4;
fill:none;
marker-end:url(#arrowhead);
}

.badge{
fill:#F5F3FF;
stroke:#DDD6FE;
rx:8;
}

.badgeText{
font:13px Arial,sans-serif;
fill:#6D28D9;
font-weight:bold;
}

</style>

<marker
id="arrowhead"
markerWidth="12"
markerHeight="12"
refX="10"
refY="6"
orient="auto">

<polygon
points="0 0 12 6 0 12"
fill="#7C3AED"/>

</marker>

</defs>

<rect width="960" height="650" fill="#0B0B0F"/>

<text x="480" y="48" text-anchor="middle" class="title">
Revoking Token Authorities
</text>

<text x="480" y="76" text-anchor="middle" class="subtitle">
Removing an authority permanently removes that permission from every wallet.
</text>

<!-- BEFORE -->

<text x="240" y="120" text-anchor="middle" class="label">
Before
</text>

<rect class="box" x="80" y="160" width="320" height="320"/>

<text x="240" y="200" text-anchor="middle" class="boxTitle">
Wallet
</text>

<rect class="badge" x="145" y="218" width="190" height="26"/>
<text x="240" y="236" text-anchor="middle" class="badgeText">
Controls the token
</text>

<text x="120" y="290" class="text">✓ Mint new tokens</text>

<text x="120" y="330" class="text">✓ Freeze accounts</text>

<text x="120" y="370" class="text">✓ Update authorities</text>

<line class="arrow" x1="240" y1="390" x2="240" y2="455"/>

<!-- AFTER -->

<text x="720" y="120" text-anchor="middle" class="label">
After Revocation
</text>

<rect class="box" x="560" y="160" width="320" height="320"/>

<text x="720" y="200" text-anchor="middle" class="boxTitle">
Authority
</text>

<rect class="badge" x="660" y="218" width="120" height="26"/>
<text x="720" y="236" text-anchor="middle" class="badgeText">
None
</text>

<text x="600" y="290" class="text">✗ Mint new tokens</text>

<text x="600" y="330" class="text">✗ Freeze accounts</text>

<text x="600" y="370" class="text">✗ Restore authority</text>

<!-- Center Arrow -->

<line class="arrow" x1="400" y1="320" x2="560" y2="320"/>

<text
x="480"
y="300"
text-anchor="middle"
class="caption">
Revoke
</text>

<!-- Footer -->

<text
x="480"
y="590"
text-anchor="middle"
class="caption">
Once an authority has been revoked, the permission is permanently removed and cannot be restored.
</text>

</svg>